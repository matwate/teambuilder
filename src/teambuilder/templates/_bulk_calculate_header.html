<div aria-label="Calculation controls" class="main-result-group" role="region">
  <div class="big-text">
    <span>{{ calculate_prompt }}</span>
    <button id="searchBtn" class="btn btn-wide ml20">Calculate</button>
    <div id="threshold" class="ml20">
      <label for="percent">Defender HP (%)</label>
      <input
        type="number"
        id="percent"
        class="calc-trigger w60"
        value="100"
        min="1"
        max="100"
      />
    </div>
  </div>
</div>
