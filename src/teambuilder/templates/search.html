<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width" />
		<title>Pok&eacute;mon Search</title>
		<link rel="icon" type="image/x-icon" href="/static/img/favicon.png" />
		<link
			type="text/css"
			rel="stylesheet"
			href="/static/js/vendor/select2/select2.css"
		/>
		<link type="text/css" rel="stylesheet" href="/static/css/main.css?" />
		<link
			type="text/css"
			rel="stylesheet"
			href="/static/css/vendor/bootstrap.css"
		/>
		<link
			type="text/css"
			rel="stylesheet"
			href="/static/css/dark-theme.css?"
			id="dark-theme-styles"
		/>
		<script
			type="text/javascript"
			src="/static/js/theme-init.js"
		></script>
		<link type="text/css" rel="stylesheet" href="/static/css/search.css" />
	</head>

	<body class="dark-theme">
		<div class="wrapper">
			<div class="header-section">
				<span class="title-text main-title-text">Pok&eacute;mon Search</span>
				<div aria-label="Navigation" role="region">
					<span class="modeSelection" role="radiogroup">
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-calculator"
						/><label class="btn btn-left btn-wide" for="page-calculator">Calculator</label>
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-search"
							checked="checked"
						/><label class="btn btn-mid btn-wide" for="page-search">Search</label>
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-bulk-ko"
						/><label class="btn btn-mid btn-wide" for="page-bulk-ko">Bulk KO</label>
						<input
							class="mode visually-hidden"
							type="radio"
							name="page"
							id="page-bulk-survive"
						/><label class="btn btn-right btn-wide" for="page-bulk-survive">Bulk Survive</label>
					</span>
				</div>
			</div>
			<hr />

			<div class="search-container">
				<div class="search-sidebar">
					<div class="filter-section">
						<h3>Type Filters</h3>
						<div class="filter-group">
							<label for="type1">Type 1</label>
							<select id="type1">
								<option value="">Any</option>
								<option value="Normal">Normal</option>
								<option value="Fire">Fire</option>
								<option value="Water">Water</option>
								<option value="Electric">Electric</option>
								<option value="Grass">Grass</option>
								<option value="Ice">Ice</option>
								<option value="Fighting">Fighting</option>
								<option value="Poison">Poison</option>
								<option value="Ground">Ground</option>
								<option value="Flying">Flying</option>
								<option value="Psychic">Psychic</option>
								<option value="Bug">Bug</option>
								<option value="Rock">Rock</option>
								<option value="Ghost">Ghost</option>
								<option value="Dragon">Dragon</option>
								<option value="Dark">Dark</option>
								<option value="Steel">Steel</option>
								<option value="Fairy">Fairy</option>
							</select>
						</div>
						<div class="filter-group">
							<label for="type2">Type 2 (optional)</label>
							<select id="type2">
								<option value="">Any</option>
								<option value="Normal">Normal</option>
								<option value="Fire">Fire</option>
								<option value="Water">Water</option>
								<option value="Electric">Electric</option>
								<option value="Grass">Grass</option>
								<option value="Ice">Ice</option>
								<option value="Fighting">Fighting</option>
								<option value="Poison">Poison</option>
								<option value="Ground">Ground</option>
								<option value="Flying">Flying</option>
								<option value="Psychic">Psychic</option>
								<option value="Bug">Bug</option>
								<option value="Rock">Rock</option>
								<option value="Ghost">Ghost</option>
								<option value="Dragon">Dragon</option>
								<option value="Dark">Dark</option>
								<option value="Steel">Steel</option>
								<option value="Fairy">Fairy</option>
							</select>
						</div>
					</div>

					<div class="filter-section">
						<h3>Stat Ranges</h3>
						<div class="filter-group">
							<label>HP</label>
							<div class="stat-range">
								<input type="number" id="hp_min" placeholder="Min" min="0" max="255" />
								<span>-</span>
								<input type="number" id="hp_max" placeholder="Max" min="0" max="255" />
							</div>
						</div>
						<div class="filter-group">
							<label>Attack</label>
							<div class="stat-range">
								<input type="number" id="atk_min" placeholder="Min" min="0" max="255" />
								<span>-</span>
								<input type="number" id="atk_max" placeholder="Max" min="0" max="255" />
							</div>
						</div>
						<div class="filter-group">
							<label>Defense</label>
							<div class="stat-range">
								<input type="number" id="defender_min" placeholder="Min" min="0" max="255" />
								<span>-</span>
								<input type="number" id="defender_max" placeholder="Max" min="0" max="255" />
							</div>
						</div>
						<div class="filter-group">
							<label>Sp. Atk</label>
							<div class="stat-range">
								<input type="number" id="spa_min" placeholder="Min" min="0" max="255" />
								<span>-</span>
								<input type="number" id="spa_max" placeholder="Max" min="0" max="255" />
							</div>
						</div>
						<div class="filter-group">
							<label>Sp. Def</label>
							<div class="stat-range">
								<input type="number" id="spd_min" placeholder="Min" min="0" max="255" />
								<span>-</span>
								<input type="number" id="spd_max" placeholder="Max" min="0" max="255" />
							</div>
						</div>
						<div class="filter-group">
							<label>Speed</label>
							<div class="stat-range">
								<input type="number" id="spe_min" placeholder="Min" min="0" max="255" />
								<span>-</span>
								<input type="number" id="spe_max" placeholder="Max" min="0" max="255" />
							</div>
						</div>
						<div class="filter-group">
							<label>BST</label>
							<div class="stat-range">
								<input type="number" id="bst_min" placeholder="Min" min="0" max="720" />
								<span>-</span>
								<input type="number" id="bst_max" placeholder="Max" min="0" max="720" />
							</div>
						</div>
					</div>

					<div class="filter-section">
						<h3>Other Filters</h3>
						<div class="filter-group">
							<label for="move">Learns Move</label>
							<select id="move">
								<option value="">Any</option>
							</select>
						</div>
					</div>

					<button class="search-btn" id="searchBtn">Search</button>
				</div>

				<div class="search-results">
					<div class="results-count" id="resultsCount"></div>
					<table class="results-table">
						<thead>
							<tr>
								<th data-column="name">Name</th>
								<th>Type</th>
								<th data-column="hp">HP</th>
								<th data-column="atk">Atk</th>
								<th data-column="def">Def</th>
								<th data-column="spa">SpA</th>
								<th data-column="spd">SpD</th>
								<th data-column="spe">Spe</th>
								<th data-column="bst">BST</th>
							</tr>
						</thead>
						<tbody id="resultsBody">
							<tr>
								<td colspan="10" style="text-align: center;">Click Search to find Pokemon</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<script src="/static/js/vendor/jquery-1.9.1.min.js"></script>
		<script src="/static/js/vendor/select2/select2.min.js"></script>
		<script src="/static/js/search.js"></script>
	</body>
</html>
