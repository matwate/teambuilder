[project]
name = "teambuilder"
version = "0.1.0"
description = "Pokemon Champions team building: pokedex search and damage calculation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mateo Puente", email = "matwap@proton.me" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "tqdm>=4.70.1",
    "typer>=0.27.2",
    "flask>=3.0.0",
]

[project.scripts]
teambuilder = "teambuilder.main:app"
build_db = "teambuilder.data:build"
demo = "teambuilder.demo:main"
test = "teambuilder.test_runner:main"
web = "teambuilder.web_server:run_web"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
